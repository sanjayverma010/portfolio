# ============================
# ✅ MySQL Configuration
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=sanjay@2004

# ============================
# ✅ JPA / Hibernate Configuration
# ============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# ============================
# ✅ JWT Configuration
# ============================
# Secret key for signing JWT tokens
jwt.secret=your-super-secret-key-change-this-in-production-2024

# Token expiration time in milliseconds (1 day)
jwt.expiration=86400000
